{
    "jobs": [{
        "name": "services:foundation",
        "cmds": [
            "exec /system/bin/begetctl param set bootevent.appfwk.ready true",
            "exec /system/bin/begetctl param set bootevent.launcher.ready true",
            "exec /system/bin/begetctl param set bootevent.wms.ready true",
            "exec /system/bin/begetctl param set bootevent.lockscreen.ready true",
            "exec /system/bin/begetctl param set bootevent.bms.main.bundles.ready true",
            "exec /system/bin/begetctl param set bootevent.boot.completed true"
        ]
    }]
}
